<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Angelynn Arts</title>
    <style>
        /* 1. STABLE FONT DEFINITIONS (jsDelivr) */
        @font-face {
            font-family: 'BodoniModa';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'EloquentJF';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'IvyPresto';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'JeanneModerno';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }

        /* 2. DESKTOP LAYOUT (Your Perfect Version) */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }
        .iframe-container {
            position: absolute;
            top: -50px; 
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 3. MOBILE FIX (Forces full-width on your Samsung) */
        @media (max-width: 768px) {
            .iframe-container {
                top: -65px; 
                height: calc(100% + 65px);
            }
            iframe {
                /* Forces the iframe to be 100% of your phone screen width */
                width: 100vw !important;
                min-width: 100% !important;
                /* Prevents the 'zoomed out' look */
                transform: scale(1);
                transform-origin: 0 0;
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
    </div>
</body>
</html>
