<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angelynn Arts</title>
    <style>
        /* 1. FONT DEFINITIONS (Keeping your working jsDelivr links) */
        @font-face {
            font-family: 'BodoniModa';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'EloquentJF';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'IvyPresto';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'JeanneModerno';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }

        /* 2. DESKTOP LAYOUT (Kept exactly as you like it) */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }
        .iframe-container {
            position: absolute;
            top: -50px; 
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 3. MOBILE FIX (Added width: 100vw to force full screen) */
        @media (max-width: 768px) {
            .iframe-container {
                top: -65px; /* Adjust if the banner is still visible on mobile */
                height: calc(100% + 65px);
            }
            iframe {
                width: 100vw !important; /* Forces the iframe to be the width of the phone screen */
                min-width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- Using your REAL link here -->
        <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
    </div>
</body>
</html>
