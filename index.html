<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. WE REMOVED "maximum-scale" and "user-scalable=no" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelynn Arts - Test</title>
    <style>
        /* [Keep your font definitions here - they are working!] */
        @font-face { font-family: 'BodoniModa'; src: url('https://jsdelivr.net') format('truetype'); }
        @font-face { font-family: 'EloquentJF'; src: url('https://jsdelivr.net') format('truetype'); }
        @font-face { font-family: 'IvyPresto'; src: url('https://jsdelivr.net') format('truetype'); }
        @font-face { font-family: 'JeanneModerno'; src: url('https://jsdelivr.net') format('truetype'); }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .iframe-container {
            position: absolute;
            top: -50px; 
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
        }

        iframe {
            /* 2. FORCE THE WIDTH TO MATCH THE SCREEN */
            width: 100vw !important;
            height: 100% !important;
            border: none;
        }

        /* 3. MOBILE SPECIFIC OVERRIDE */
        @media (max-width: 768px) {
            .iframe-container {
                top: -65px; /* Deeper cut for mobile */
                height: calc(100% + 65px);
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
    </div>
</body>
</html>
