<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angelynn Arts</title>
    <style>
        /* [KEEP YOUR @font-face BLOCKS HERE] */

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .iframe-container {
            position: absolute;
            top: -50px; 
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
            /* This helps center the site before we stretch it */
            display: flex;
            justify-content: center;
        }

        iframe {
            width: 100vw !important;
            height: 100% !important;
            border: none;
        }

        /* MOBILE STRETCH FIX */
        @media (max-width: 768px) {
            .iframe-container {
                top: -65px; 
                height: calc(100% + 65px);
            }
            iframe {
                /* This is the magic line: it forces the 'blue-ish' gaps to disappear */
                width: 100% !important;
                min-width: 100% !important;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
    </div>
</body>
</html>
