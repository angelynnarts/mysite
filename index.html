<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. We enabled scaling back so the phone can find the right fit -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelynn Arts</title>
    <style>
        @font-face {
            font-family: 'BodoniModa';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'EloquentJF';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'IvyPresto';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }
        @font-face {
            font-family: 'JeanneModerno';
            src: url('https://jsdelivr.net') format('truetype');
            font-display: swap;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }

        .iframe-container {
            position: absolute;
            top: -50px; 
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 2. THE SAMSUNG STRETCH FIX */
        @media (max-width: 768px) {
            .iframe-container {
                top: -65px; 
                height: calc(100% + 65px);
                width: 100%;
                overflow: hidden;
            }
            iframe {
                /* This zooms the content by 28% to fill the white gaps */
                width: 100%;
                height: 100%;
                transform: scale(1.28);
                transform-origin: 0 0;
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
    </div>
</body>
</html>
